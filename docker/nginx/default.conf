# Nginx-Config für das Friday-Kiosk-Frontend.
# Liefert die statische SPA aus und proxyt WebSocket-Verkehr ans Backend,
# sodass Frontend und Backend unter einem Origin laufen (kiosk-freundlich).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA-Fallback: alle Routen auf index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # WebSocket-Proxy zum Backend (Service-Name aus docker-compose: backend)
    location /ws {
        proxy_pass http://backend:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s; # langlebige WS-Verbindung
    }

    # HTTP-API-Proxy (Health/Meta)
    location ~ ^/(health|meta) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
}
